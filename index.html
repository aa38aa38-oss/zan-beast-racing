<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>讚獸衝衝衝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Iansui&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: full-bleed 3D stage on a blackboard; HUD and cards are white stickers with a black marker line, like the sketch */
  --board:#3f3f3f;
  --board-deep:#2a2a2d;
  --paper:#ffffff;
  --ink:#141414;
  --pen:#2230b0;
  --hi:#ffe14d;
  --display:"Iansui","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --num:"Caveat Brush","Iansui","PingFang TC","Microsoft JhengHei",sans-serif;
  --wob:255px 18px 225px 18px/18px 225px 18px 255px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--board);color:var(--paper);font-family:var(--display);overflow:hidden}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#streaks{position:absolute;inset:-25%;pointer-events:none;opacity:0;transition:opacity .25s;
  background:repeating-conic-gradient(from 0deg,transparent 0 5deg,rgba(255,255,255,.55) 5deg 5.5deg,transparent 5.5deg 11deg);
  -webkit-mask-image:radial-gradient(circle,transparent 34%,#000 72%);mask-image:radial-gradient(circle,transparent 34%,#000 72%)}
#streaks.on{opacity:.7}

.stk{background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:0 0 0 4px var(--paper);border-radius:var(--wob)}
.out{color:var(--paper);text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),-2px -2px var(--ink)}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#hud[hidden]{display:none}
.chip{position:absolute;top:14px;padding:4px 14px 5px;font-size:17px;line-height:1.15;white-space:nowrap}
.chip b{font-family:var(--num);font-size:30px;font-weight:400;font-variant-numeric:tabular-nums}
#rank{left:16px;transform:rotate(-3deg)}
#lap{left:50%;transform:translateX(-50%) rotate(1.5deg)}
#time{right:16px;transform:rotate(2deg);font-family:var(--num);font-size:26px;font-variant-numeric:tabular-nums;min-width:96px;text-align:center}
#speed{position:absolute;left:50%;bottom:132px;transform:translateX(-50%);text-align:center;font-family:var(--num);line-height:1}
#speed b{font-size:44px;font-weight:400;font-variant-numeric:tabular-nums}
#speed span{font-size:18px;margin-left:4px}
#meter{position:absolute;left:50%;bottom:102px;transform:translateX(-50%);display:flex;gap:6px}
#meter i{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);box-shadow:0 0 0 2px var(--paper)}
#meter i.on{background:var(--pen)}
#boost{position:absolute;left:50%;bottom:22px;transform:translateX(-50%) rotate(-2deg);pointer-events:auto;
  font-family:var(--display);font-size:28px;line-height:1;padding:12px 30px 14px;cursor:pointer;touch-action:none;opacity:.45}
#boost.ready{opacity:1;background:var(--pen);color:var(--paper);animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{transform:translateX(-50%) rotate(2deg) scale(1.1)}}
.pad{position:absolute;bottom:24px;width:74px;height:74px;display:grid;place-items:center;font-size:30px;
  color:var(--paper);border:3px dashed rgba(255,255,255,.55);border-radius:var(--wob);opacity:.7}
#padL{left:16px}#padR{right:16px}
.pad.on{background:var(--paper);color:var(--ink);border-style:solid;border-color:var(--ink);box-shadow:0 0 0 4px var(--paper);opacity:1}

#count{position:absolute;left:0;right:0;top:26%;text-align:center;font-family:var(--num);font-size:min(38vw,190px);line-height:1;pointer-events:none;opacity:0;transform:rotate(-5deg)}
#count.show{animation:pop .85s ease-out both}
#count.small{font-family:var(--display);font-size:min(13vw,64px);top:30%}
@keyframes pop{0%{opacity:0;transform:rotate(-5deg) scale(.4)}18%{opacity:1;transform:rotate(-5deg) scale(1.12)}70%{opacity:1;transform:rotate(-5deg) scale(1)}100%{opacity:0;transform:rotate(-5deg) scale(1.05)}}

/* title + result */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:22px 16px 20px;pointer-events:none}
.screen[hidden]{display:none}
.screen>*{pointer-events:auto}
h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,15vw,104px);line-height:1;letter-spacing:.02em;transform:rotate(-4deg);text-wrap:balance;text-align:center;margin-top:8px}
.tag{font-size:17px;margin-top:14px;text-align:center;transform:rotate(-4deg)}
.card{width:min(100%,560px);padding:14px 16px 16px;display:flex;gap:14px;align-items:center}
.sketch{flex:0 0 34%;max-width:170px;text-align:center;font-size:14px}
.sketch img{display:block;width:100%;height:auto;border-radius:10px;border:3px solid var(--ink)}
.sketch span{display:inline-block;margin-top:5px}
.how{flex:1;min-width:0}
.how ol{list-style:none;display:grid;gap:5px;font-size:15.5px;line-height:1.35}
.how li{padding-left:1.5em;position:relative}
.how li::before{content:attr(data-n);position:absolute;left:0;top:0;font-family:var(--num);font-size:20px;line-height:1.05;color:var(--pen)}
.how .kbd{display:none}
@media (hover:hover) and (pointer:fine){.how .kbd{display:block}}
.go{display:block;width:100%;margin-top:12px;font-family:var(--display);font-size:24px;line-height:1;padding:11px 12px 13px;cursor:pointer;
  background:var(--pen);color:var(--paper);border:3px solid var(--ink);border-radius:var(--wob);box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink)}
.go:active{transform:translateY(2px) rotate(-1deg)}
button:focus-visible{outline:4px solid var(--hi);outline-offset:4px}
#result .card{flex-direction:column;align-items:stretch;text-align:center;gap:4px}
#place{font-size:clamp(34px,10vw,56px);line-height:1.1}
#place b{font-family:var(--num);font-weight:400;font-size:1.5em;color:var(--pen)}
#times{font-family:var(--num);font-size:24px;font-variant-numeric:tabular-nums}
#err{position:absolute;left:16px;right:16px;top:40%;padding:14px;font-size:15px;line-height:1.5;display:none}
@media (max-height:520px){h1{font-size:44px}.tag{display:none}.card{padding:8px 12px}.sketch{max-width:110px}#speed{bottom:104px}#meter{bottom:80px}#boost{bottom:12px;font-size:22px;padding:8px 22px 10px}.pad{bottom:12px}}
@media (prefers-reduced-motion:reduce){#boost.ready{animation:none}#streaks{display:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="streaks"></div>

  <div id="hud" hidden>
    <div class="chip stk" id="rank">第 <b id="rankN">4</b> 名</div>
    <div class="chip stk" id="lap">圈 <b id="lapN">1</b>/3</div>
    <div class="chip stk" id="time">0:00.0</div>
    <div id="speed" class="out"><b id="spd">0</b><span>km/h</span></div>
    <div id="meter"><i></i><i></i><i></i><i></i><i></i></div>
    <button id="boost" class="stk" type="button">衝！</button>
    <div class="pad" id="padL">◀</div>
    <div class="pad" id="padR">▶</div>
  </div>

  <div id="count" class="out"></div>

  <section id="title" class="screen">
    <header>
      <h1 class="out">讚獸衝衝衝</h1>
      <p class="tag out">你的草稿，現在是一台 3D 賽車</p>
    </header>
    <div class="card stk">
      <div class="sketch"><img id="sketchImg" alt="手繪原稿：長牙大嘴、比讚的手、身上寫著「讚！」的怪獸"><span>原稿</span></div>
      <div class="how">
        <ol>
          <li data-n="1">按住螢幕左半、右半來轉彎</li>
          <li data-n="2">吃滿 5 個讚，按「衝！」加速</li>
          <li data-n="3">跑 3 圈，贏過 3 隻螢光筆怪獸</li>
          <li data-n="+" class="kbd">鍵盤：← → 轉彎，空白鍵衝刺</li>
        </ol>
        <button class="go" id="startBtn" type="button">出發</button>
      </div>
    </div>
  </section>

  <section id="result" class="screen" hidden>
    <span></span>
    <div class="card stk">
      <div id="place"></div>
      <div id="times"></div>
      <button class="go" id="againBtn" type="button">再跑一次</button>
    </div>
  </section>

  <div id="err" class="stk"></div>
</div>

function R(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}

var CTRL=[[0,-70],[0,50],[0,165],[42,262],[150,300],[246,256],[264,150],[206,84],[214,-6],[292,-70],[286,-172],[190,-218],[92,-236],[16,-186],[0,-125]];
var W=9, RW=10.2, N=720, LAPS=3;
var L,PX,PZ,TX,TZ,K;
(function buildTrack(){
  var n=CTRL.length,D=[],i,j,a,b;
  for(i=0;i<n;i++){var p0=CTRL[(i-1+n)%n],p1=CTRL[i],p2=CTRL[(i+1)%n],p3=CTRL[(i+2)%n];
    for(j=0;j<80;j++){var t=j/80,t2=t*t,t3=t2*t,o=[0,0];
      for(a=0;a<2;a++)o[a]=0.5*(2*p1[a]+(-p0[a]+p2[a])*t+(2*p0[a]-5*p1[a]+4*p2[a]-p3[a])*t2+(-p0[a]+3*p1[a]-3*p2[a]+p3[a])*t3);
      D.push(o);}}
  var m=D.length,cum=[0];
  for(i=1;i<=m;i++){a=D[i-1];b=D[i%m];cum[i]=cum[i-1]+Math.hypot(b[0]-a[0],b[1]-a[1]);}
  L=cum[m];PX=new Float32Array(N);PZ=new Float32Array(N);TX=new Float32Array(N);TZ=new Float32Array(N);K=new Float32Array(N);
  j=0;
  for(i=0;i<N;i++){var d=i/N*L;while(cum[j+1]<d)j++;var u=(d-cum[j])/(cum[j+1]-cum[j]);a=D[j];b=D[(j+1)%m];PX[i]=a[0]+(b[0]-a[0])*u;PZ[i]=a[1]+(b[1]-a[1])*u;}
  var TH=new Float32Array(N),raw=new Float32Array(N),ds=L/N;
  for(i=0;i<N;i++){var ia=(i-1+N)%N,ib=(i+1)%N,x=PX[ib]-PX[ia],z=PZ[ib]-PZ[ia],l=Math.hypot(x,z);TX[i]=x/l;TZ[i]=z/l;TH[i]=Math.atan2(x,z);}
  for(i=0;i<N;i++){var dd=TH[(i+1)%N]-TH[(i-1+N)%N];while(dd>Math.PI)dd-=2*Math.PI;while(dd<-Math.PI)dd+=2*Math.PI;raw[i]=dd/(2*ds);}
  for(i=0;i<N;i++){var s=0;for(var q=-3;q<=3;q++)s+=raw[(i+q+N)%N];K[i]=s/7;}
})();
function S(dist,o){
  var s=((dist%L)+L)%L,f=s/L*N,fl=Math.floor(f),i=fl%N,j=(i+1)%N,u=f-fl;
  o.x=PX[i]+(PX[j]-PX[i])*u;o.z=PZ[i]+(PZ[j]-PZ[i])*u;
  var tx=TX[i]+(TX[j]-TX[i])*u,tz=TZ[i]+(TZ[j]-TZ[i])*u,l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;
  o.tx=tx;o.tz=tz;o.rx=-tz;o.rz=tx;o.k=K[i]+(K[j]-K[i])*u;o.th=Math.atan2(tx,tz);return o;
}
function wrapD(a){return ((a+L/2)%L+L)%L-L/2;}

var INKC='#141414',PEN='#2230b0';
function cv(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(c,rep){var t=new THREE.CanvasTexture(c);if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;}t.anisotropy=MAXA;return t;}
function jit(a){return (R()-0.5)*a;}
/* sticker made of circles: white halo, black line, white fill */
function blob(x,circles,fill){
  var i,c;
  x.fillStyle='#fff';for(i=0;i<circles.length;i++){c=circles[i];x.beginPath();x.arc(c[0],c[1],c[2]+15,0,7);x.fill();}
  x.fillStyle=INKC;for(i=0;i<circles.length;i++){c=circles[i];x.beginPath();x.arc(c[0],c[1],c[2]+5,0,7);x.fill();}
  x.fillStyle=fill||'#fff';for(i=0;i<circles.length;i++){c=circles[i];x.beginPath();x.arc(c[0],c[1],c[2]-4,0,7);x.fill();}
}
function spiral(x,cx,cy,r0,r1,turns,lw,col){
  x.beginPath();var st=turns*40,i;
  for(i=0;i<=st;i++){var a=i/40*Math.PI*2,r=r0+(r1-r0)*i/st,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;if(i)x.lineTo(px,py);else x.moveTo(px,py);}
  x.lineCap='round';x.lineJoin='round';x.lineWidth=lw;x.strokeStyle=col||INKC;x.stroke();
}
function poly(x,pts,close){x.beginPath();for(var i=0;i<pts.length;i++){if(i)x.lineTo(pts[i][0],pts[i][1]);else x.moveTo(pts[i][0],pts[i][1]);}if(close)x.closePath();}
function stickerPoly(x,pts,fill){
  x.lineJoin='round';x.lineCap='round';
  poly(x,pts,true);x.strokeStyle='#fff';x.lineWidth=30;x.stroke();
  poly(x,pts,true);x.fillStyle=fill||'#fff';x.fill();
  poly(x,pts,true);x.strokeStyle=INKC;x.lineWidth=9;x.stroke();
}

  try{var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    g.gain.setValueAtTime(vol||0.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}
}

/* ================= HUD ================= */
var hud=$('hud'),elRank=$('rankN'),elLap=$('lapN'),elTime=$('time'),elSpd=$('spd'),elBoost=$('boost'),elCount=$('count'),pips=$('meter').children,padL=$('padL'),padR=$('padR'),streaks=$('streaks');
var shown={};
function setText(el,key,v){if(shown[key]!==v){shown[key]=v;el.textContent=v;}}
function fmt(t){var m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1);}
function setMeter(){for(var i=0;i<5;i++)pips[i].className=i<meter?'on':'';elBoost.className='stk'+(meter>=5?' ready':'');}
function flash(txt,small){elCount.className='out';elCount.textContent=txt;void elCount.offsetWidth;elCount.className='out show'+(small?' small':'');}
function fireBoost(){if(state!=='race'||meter<5)return;meter=0;setMeter();boostT=2.7;sfx(220,0.5,'sawtooth',0.06,660);}
elBoost.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();fireBoost();});
function rankOf(){var r=1;for(var i=1;i<cars.length;i++){var c=cars[i];if(c.fin!==null||c.dist>P.dist)r++;}return r;}

function begin(){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume();}catch(e){AC=null;}
  reset();$('title').hidden=true;$('result').hidden=true;hud.hidden=false;state='count';countT=3.4;shown.c=null;
}
$('startBtn').addEventListener('click',begin);$('againBtn').addEventListener('click',begin);

function finish(){
  state='done';finished=0;hud.hidden=true;streaks.className='';
  var place=1;for(var i=1;i<cars.length;i++)if(cars[i].fin!==null)place++;
  var best=null;try{best=parseFloat(localStorage.getItem('zan-best'));}catch(e){}
  var isBest=!(best>0)||raceT<best;
  if(isBest){try{localStorage.setItem('zan-best',String(raceT));}catch(e){}}
  var msg=['讚啦！','差一點！','還不錯','再來一次'][place-1];
  $('place').innerHTML=msg+' 第 <b>'+place+'</b> 名';
  $('times').textContent=fmt(raceT)+(isBest?'  新紀錄':'  最佳 '+fmt(best));
  $('result').hidden=false;
  sfx(place===1?523:330,0.18,'square',0.06);setTimeout(function(){sfx(place===1?784:262,0.35,'square',0.06);},180);
}

/* ================= simulation ================= */
function driveAI(c,dt,now){
  S(c.dist,sA);var k=sA.k;S(c.dist+35,sB);
  var tx=clamp(-sB.k*260,-W*0.62,W*0.62)+c.lane,i,o;
  for(i=0;i<cars.length;i++){o=cars[i];if(o===c)continue;var d=o.dist-c.dist;if(d>0&&d<16&&Math.abs(o.x-c.x)<2.9)tx+=(c.x>=o.x?1:-1)*3.6;}
  tx=clamp(tx,-W+1.6,W-1.6);
  var lv=clamp(tx-c.x,-1,1)*9;c.x+=lv*dt;c.yaw=lerp(c.yaw,lv/9,1-Math.exp(-6*dt));
  var band=1;if(!c.isP){var gap=c.dist-P.dist;band=gap>70?0.93:gap<-70?1.06:1;}
  var tv=c.base*band*(1-Math.min(0.16,Math.abs(k)*4.5))*(1+0.03*Math.sin(now*0.7+c.ph));
  c.v+=(tv-c.v)*1.2*dt;c.dist+=c.v*dt/clamp(1+c.x*k,0.7,1.5);
}
function drivePlayer(dt){
  S(P.dist,sA);var k=sA.k,st=steerInput();
  steerVis=lerp(steerVis,st,1-Math.exp(-10*dt));P.yaw=steerVis;
  var off=Math.abs(P.x)>W+0.4,target=boostT>0?VBOOST:VMAX;if(off)target=Math.min(target,30);
  P.v+=(target-P.v)*(target>P.v?(boostT>0?2.4:0.95):2.4)*dt;
  P.x+=steerVis*STEER*(0.45+0.55*P.v/VMAX)*dt+k*P.v*P.v*CENT*dt;
  P.x=clamp(P.x,-(W+5),W+5);
  P.dist+=P.v*dt/clamp(1+P.x*k,0.7,1.5);
  if(boostT>0)boostT-=dt;if(hitT>0)hitT-=dt;
  var s=((P.dist%L)+L)%L,i,t,ds;
  for(i=0;i<tokens.length;i++){t=tokens[i];if(t.taken)continue;ds=wrapD(t.s-s);
    if(Math.abs(ds)<2.8&&Math.abs(t.x-P.x)<2.4){t.taken=true;t.sp.visible=false;if(meter<5){meter++;setMeter();}sfx(660+meter*110,0.1,'square',0.05);}}
  for(i=0;i<pads.length;i++){t=pads[i];ds=wrapD(t.s-s);if(Math.abs(ds)<4.5&&Math.abs(t.x-P.x)<3.2&&boostT<1.2){boostT=1.3;sfx(330,0.3,'sawtooth',0.05,500);}}
  if(hitT<=0)for(i=0;i<blots.length;i++){t=blots[i];ds=wrapD(t.s-s);if(Math.abs(ds)<2.6&&Math.abs(t.x-P.x)<2.6){P.v*=0.5;boostT=0;hitT=1.1;shake=0.5;sfx(140,0.25,'sawtooth',0.07,-80);}}
  var lap=Math.floor(P.dist/L);
  if(lap>lastLap){lastLap=lap;tokens.forEach(function(q){q.taken=false;q.sp.visible=true;});
    if(lap<LAPS){flash(lap===LAPS-1?'最後一圈！':'第 '+(lap+1)+' 圈',true);sfx(523,0.12,'square',0.05);}}
}
function collide(){
  for(var i=0;i<cars.length;i++)for(var j=i+1;j<cars.length;j++){
    var a=cars[i],b=cars[j],d=b.dist-a.dist,dx=b.x-a.x;
    if(Math.abs(d)<4.6&&Math.abs(dx)<2.3){
      var push=(2.3-Math.abs(dx))*0.5*(dx<0?-1:1);a.x-=push;b.x+=push;
      var rear=d>0?a:b,front=d>0?b:a;if(rear.v>front.v)rear.v=front.v*0.97;
      if((a.isP||b.isP)&&state==='race'&&shake<0.15){shake=0.25;sfx(180,0.08,'square',0.05);}
    }}
}

var last=0;
function frame(ms){
  requestAnimationFrame(frame);
  var now=ms/1000,dt=Math.min(0.05,now-last||0.016);last=now;
  var i,c;
  if(state==='count'){
    countT-=dt;var n=Math.ceil(countT);
    if(n!==shown.c&&n>=1&&n<=3){shown.c=n;flash(String(n));sfx(440,0.12,'square',0.05);}
    if(countT<=0){state='race';flash('衝！');sfx(880,0.35,'square',0.06);}
  }
  if(state==='race'||state==='done'){
    if(state==='race'){raceT+=dt;drivePlayer(dt);}else{driveAI(P,dt,now);}
    for(i=1;i<cars.length;i++)driveAI(cars[i],dt,now);
    collide();
    for(i=0;i<cars.length;i++){c=cars[i];c.x=clamp(c.x,-(W+5),W+5);if(c.fin===null&&c.dist>=LAPS*L){c.fin=raceT;if(c.isP&&state==='race')finish();}}
  }
  for(i=0;i<cars.length;i++)placeCar(cars[i],now);
  var spin=P.v*dt/0.4;spinR.rotation+=spin;spinL.rotation-=spin;
  for(i=0;i<tokens.length;i++){var t=tokens[i];if(!t.taken)t.sp.position.y=1.7+Math.sin(now*3+t.ph)*0.25;}

  /* camera */
  var ease;
  if(state==='title'||state==='done'){
    orbit+=dt*(reduce?0.08:0.3);var rad=portrait?12.5:10.5,pp=P.g.position;
    camDes.set(pp.x+Math.cos(orbit)*rad,3.3,pp.z+Math.sin(orbit)*rad);lookDes.set(pp.x,state==='done'?0.2:1.1,pp.z);
    ease=camInit?1-Math.exp(-2.5*dt):1;
  }else{
    S(P.dist-camBack,sB);camX=lerp(camX,P.x*0.8,1-Math.exp(-7*dt));
    camDes.set(sB.x+sB.rx*camX,camH,sB.z+sB.rz*camX);
    S(P.dist+16,sC);lookDes.set(sC.x+sC.rx*P.x*0.5,1.2,sC.z+sC.rz*P.x*0.5);
    ease=state==='count'?1-Math.exp(-3.2*dt):1-Math.exp(-22*dt);
  }
  camInit=true;
  camera.position.lerp(camDes,ease);look.lerp(lookDes,ease);
  if(shake>0){shake-=dt;if(!reduce){camera.position.x+=(Math.random()-0.5)*shake*1.2;camera.position.y+=(Math.random()-0.5)*shake*0.8;}}
  camera.up.set(0,1,0);camera.lookAt(look);
  if(state==='race'&&!reduce)camera.rotateZ(-steerVis*0.045);
  var boosting=state==='race'&&boostT>0;
  var fovT=baseFov+(boosting&&!reduce?7:0);
  if(Math.abs(camera.fov-fovT)>0.05){camera.fov=lerp(camera.fov,fovT,1-Math.exp(-5*dt));camera.updateProjectionMatrix();}
  horizon.position.x=camera.position.x;horizon.position.z=camera.position.z;
  sunSp.position.set(camera.position.x-900,430,camera.position.z+1250);

  if(state==='race'||state==='count'){
    setText(elRank,'r',String(rankOf()));
    setText(elLap,'l',String(clamp(Math.floor(P.dist/L)+1,1,LAPS)));
    setText(elTime,'t',fmt(raceT));
    setText(elSpd,'s',String(Math.round(P.v*3.3)));
    var st=state==='race'?steerInput():0;
    if(shown.pl!==st){shown.pl=st;padL.className='pad'+(st<0?' on':'');padR.className='pad'+(st>0?' on':'');}
    if(shown.b!==boosting){shown.b=boosting;streaks.className=boosting?'on':'';}
  }
  renderer.render(scene,camera);
}

reset();
inkImg.src=INK_SRC;sketchImg.src=SKETCH_SRC;
requestAnimationFrame(frame);
})();
</script>
