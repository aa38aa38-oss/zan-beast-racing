<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>讚獸衝衝衝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Iansui&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: full-bleed 3D stage under a bright sky; every panel and HUD chip is a white sticker with a black marker line, like the sketches */
  --sky:#8fd0ff;
  --paper:#ffffff;
  --ink:#141414;
  --pen:#2230b0;
  --hi:#ffe14d;
  --mute:#6b6b70;
  --display:"Iansui","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --num:"Caveat Brush","Iansui","PingFang TC","Microsoft JhengHei",sans-serif;
  --wob:255px 18px 225px 18px/18px 225px 18px 255px;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--sky);color:var(--ink);font-family:var(--display);overflow:hidden}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#streaks{position:absolute;inset:-25%;pointer-events:none;opacity:0;transition:opacity .25s;
  background:repeating-conic-gradient(from 0deg,transparent 0 5deg,rgba(255,255,255,.7) 5deg 5.5deg,transparent 5.5deg 11deg);
  -webkit-mask-image:radial-gradient(circle,transparent 34%,#000 72%);mask-image:radial-gradient(circle,transparent 34%,#000 72%)}
#streaks.on{opacity:.75}

.stk{background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:0 0 0 4px var(--paper);border-radius:var(--wob)}
.out{color:var(--paper);text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),-2px -2px var(--ink)}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#hud[hidden]{display:none}
.chip{position:absolute;top:14px;padding:4px 14px 5px;font-size:17px;line-height:1.15;white-space:nowrap}
.chip b{font-family:var(--num);font-size:30px;font-weight:400;font-variant-numeric:tabular-nums}
#rank{left:16px;transform:rotate(-3deg)}
#lap{left:50%;transform:translateX(-50%) rotate(1.5deg)}
#time{right:16px;transform:rotate(2deg);font-family:var(--num);font-size:26px;font-variant-numeric:tabular-nums;min-width:96px;text-align:center}
#speed{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);text-align:center;font-family:var(--num);line-height:1;white-space:nowrap}
#speed b{font-size:40px;font-weight:400;font-variant-numeric:tabular-nums}
#speed span{font-size:17px;margin-left:4px}
#items{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:7px;pointer-events:auto}
.slot{width:min(64px,calc((100vw - 214px)/3));aspect-ratio:1/1;cursor:pointer;touch-action:none;font-family:var(--display);font-size:30px;line-height:1;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.55);color:var(--paper);border:3px dashed var(--mute);padding:0}
.slot.has{border:3px solid var(--ink);box-shadow:0 0 0 3px var(--paper)}
.slot.has:first-child{animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08) rotate(4deg)}}
.pad{position:absolute;bottom:26px;width:74px;height:74px;display:grid;place-items:center;font-size:30px;
  color:var(--paper);border:3px dashed rgba(255,255,255,.8);border-radius:var(--wob);opacity:.8;text-shadow:0 0 4px rgba(0,0,0,.5)}
#padL{left:16px}#padR{right:16px}
.pad.on{background:var(--paper);color:var(--ink);border-style:solid;border-color:var(--ink);box-shadow:0 0 0 4px var(--paper);opacity:1;text-shadow:none}

#count{position:absolute;left:0;right:0;top:24%;text-align:center;font-family:var(--num);font-size:min(38vw,190px);line-height:1;pointer-events:none;opacity:0;transform:rotate(-5deg)}
#count.show{animation:pop .9s ease-out both}
#count.small{font-family:var(--display);font-size:min(12vw,60px);top:28%}
@keyframes pop{0%{opacity:0;transform:rotate(-5deg) scale(.4)}18%{opacity:1;transform:rotate(-5deg) scale(1.12)}70%{opacity:1;transform:rotate(-5deg) scale(1)}100%{opacity:0;transform:rotate(-5deg) scale(1.05)}}

/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:14px 14px 16px;pointer-events:none}
.screen[hidden]{display:none}
.screen>*{pointer-events:auto}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,11vw,76px);line-height:1;letter-spacing:.02em;transform:rotate(-3deg);text-align:center;margin-top:4px}
.tag{font-size:18px;text-align:center;transform:rotate(-3deg)}
.card{width:min(100%,520px);padding:12px 14px 14px;display:grid;gap:9px;user-select:none}
.row{display:flex;gap:9px;align-items:center}
.row>*{flex:1;min-width:0}
.row>label{flex:0 0 auto;font-size:16px}
input{font-family:var(--display);font-size:18px;line-height:1.2;padding:7px 10px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);
  user-select:text;-webkit-user-select:text;width:100%}
input::placeholder{color:var(--mute)}
#codeIn{font-family:var(--num);font-size:24px;letter-spacing:.2em;text-align:center}
#picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#picker button{position:relative;aspect-ratio:1/1;padding:0;border:3px solid var(--ink);border-radius:12px;background:#3f3f3f;overflow:hidden;cursor:pointer}
#picker img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
#picker button[aria-checked="true"]{box-shadow:0 0 0 4px var(--pen);transform:rotate(-2deg) scale(1.04);z-index:1}
.hint{font-size:14px;line-height:1.4;color:var(--mute);text-align:center}
.msg{font-size:15px;line-height:1.4;color:#c0281c;text-align:center;min-height:0}
.msg:empty{display:none}
.go{font-family:var(--display);font-size:21px;line-height:1;padding:10px 10px 12px;cursor:pointer;white-space:nowrap;
  background:var(--pen);color:var(--paper);border:3px solid var(--ink);border-radius:var(--wob)}
.go.alt{background:var(--paper);color:var(--ink)}
.go:active{transform:translateY(2px) rotate(-1deg)}
.go:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:4px solid var(--hi);outline-offset:3px}
#roomCode{font-family:var(--num);font-size:clamp(60px,22vw,120px);letter-spacing:.08em}
ol.list{list-style:none;display:grid;gap:5px}
ol.list li{display:flex;align-items:center;gap:9px;font-size:17px;line-height:1.2;padding:3px 8px 3px 4px;border:2px solid var(--ink);border-radius:10px}
ol.list li.me{background:var(--hi)}
ol.list img{width:34px;height:34px;object-fit:cover;border-radius:7px;border:2px solid var(--ink);background:#3f3f3f;flex:none}
ol.list b{font-family:var(--num);font-weight:400;font-size:24px;width:1.1em;text-align:center;flex:none;color:var(--pen)}
ol.list span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.list em{font-style:normal;font-size:14px;color:var(--mute);font-family:var(--num);font-variant-numeric:tabular-nums;flex:none}
#place{font-size:clamp(26px,8vw,40px);line-height:1.1;text-align:center}
#place b{font-family:var(--num);font-weight:400;font-size:1.5em;color:var(--pen)}
#err{position:absolute;left:16px;right:16px;top:40%;padding:14px;font-size:15px;line-height:1.5;display:none;z-index:9}
@media (max-height:640px){h1{font-size:32px}.card{gap:6px;padding:8px 12px 10px}#picker{grid-template-columns:repeat(8,1fr);gap:5px}.hint{font-size:13px}ol.list li{font-size:15px;padding:1px 8px 1px 3px}ol.list img{width:26px;height:26px}}
@media (max-height:520px){#speed{bottom:84px}#items{bottom:12px}.pad{bottom:12px}}
@media (prefers-reduced-motion:reduce){.slot.has:first-child{animation:none}#streaks{display:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="streaks"></div>

  <div id="hud" hidden>
    <div class="chip stk" id="rank">第 <b id="rankN">6</b>/6 名</div>
    <div class="chip stk" id="lap">圈 <b id="lapN">1</b>/3</div>
    <div class="chip stk" id="time">0:00.0</div>
    <div id="speed" class="out"><b id="spd">0</b><span>km/h</span></div>
    <div id="items"><button class="slot" type="button" aria-label="使用第 1 個道具"></button><button class="slot" type="button" aria-label="使用第 2 個道具"></button><button class="slot" type="button" aria-label="使用第 3 個道具"></button></div>
    <div class="pad" id="padL">◀</div>
    <div class="pad" id="padR">▶</div>
  </div>

  <div id="count" class="out"></div>

  <section id="home" class="screen">
    <header><h1 class="out">讚獸衝衝衝</h1></header>
    <div class="card stk">
      <div class="row"><label for="nameIn">名字</label><input id="nameIn" maxlength="6" autocomplete="off" placeholder="最多 6 個字"></div>
      <div id="picker" role="radiogroup" aria-label="選一台車"></div>
      <p class="hint">按住螢幕左、右半邊轉彎．撞「？」拿道具（最多帶 3 個）．按圓鈕使用</p>
      <div class="row"><button class="go" id="soloBtn" type="button">單人賽</button><button class="go alt" id="hostBtn" type="button">開房間</button></div>
      <div class="row"><input id="codeIn" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="房號" aria-label="房號"><button class="go alt" id="joinBtn" type="button">加入房間</button></div>
      <p class="msg" id="homeMsg" role="status"></p>
    </div>
  </section>

  <section id="lobby" class="screen" hidden>
    <header><p class="tag out">房號</p><h1 class="out" id="roomCode">----</h1></header>
    <div class="card stk">
      <p class="hint">把房號傳給朋友，最多 6 人一起跑；空位由電腦補上</p>
      <ol class="list" id="roster"></ol>
      <div class="row"><button class="go alt" id="leaveBtn" type="button">離開</button><button class="go" id="startBtn" type="button">開始比賽</button></div>
      <p class="msg" id="lobbyMsg" role="status"></p>
    </div>
  </section>

  <section id="result" class="screen" hidden>
    <span></span>
    <div class="card stk">
      <div id="place"></div>
      <ol class="list" id="standings"></ol>
      <div class="row"><button class="go alt" id="backBtn" type="button">換角色</button><button class="go" id="againBtn" type="button">再跑一次</button></div>
      <p class="msg" id="resultMsg" role="status"></p>
    </div>
  </section>

  <div id="err" class="stk"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function hit(c,kind){

  c.boost=0;c.stunK=kind;
  if(kind===1){c.stun=1.9;c.v*=0.2;c.inv=3.4;}
  else if(kind===2){c.stun=1.1;c.v*=0.62;c.inv=2.2;}
  else{c.stun=1.1;c.v=0;c.inv=2.6;}
  if(c===me&&state==='race'){shake=0.6;flash(['','被火噴到！','被水柱打中！','撞到土牆！'][kind],true);sfx(kind===3?110:150,0.4,'sawtooth',0.08,-90);}
}
function applyEvent(ev,now){
  var a=cars[ev.from],i,c;
  if(ev.k==='fire'){if(a)fireFx(a);sfx(200,0.35,'sawtooth',0.05,300);
    for(i=0;i<cars.length;i++){c=cars[i];if(c.own&&c.i!==ev.from&&Math.hypot(wrapD(c.dist-ev.d),c.x-ev.x)<FIRE_R)hit(c,1);}}
  else if(ev.k==='water'){var b=cars[ev.to];if(a&&b){sfx(700,0.3,'sine',0.06,-400);waterFx(a,b,function(){if(b.own)hit(b,2);});}}
  else if(ev.k==='hole'){addHole(ev);}
  else if(ev.k==='holeX'){dropHole(ev.id);}
}
function emit(ev){applyEvent(ev);netEvent(ev);}
function useItem(c,idx){
  var it=c.items[idx],i,o;if(!it)return false;
  if(it===1){emit({k:'fire',from:c.i,d:c.dist,x:c.x});}
  else if(it===2){var best=null,bd=1e9;for(i=0;i<cars.length;i++){o=cars[i];var d=o.dist-c.dist;if(o!==c&&d>1&&d<320&&d<bd){bd=d;best=o;}}
    if(!best){if(c===me)flash('前面沒有人',true);return false;}
    emit({k:'water',from:c.i,to:best.i});}
  else if(it===3){emit({k:'hole',id:c.i+'-'+(holeSeq++)+'-'+Math.floor(Math.random()*1e4),s:mod(c.dist-6.5),x:clamp(c.x,-(W-WALL_W/2),W-WALL_W/2),from:c.i});sfx(120,0.2,'square',0.05);}
  else{c.boost=3;if(c===me)sfx(220,0.5,'sawtooth',0.06,660);}

}

    else if(c.items.length<2&&c.lastBox!==b.s){c.lastBox=b.s;if(Math.random()<0.8){c.items.push(1+Math.floor(Math.random()*4));if(c.items.length===1){c.useT=0.8+Math.random()*3;c.holdT=0;}}}

function humanAvg(){var s=0,n=0;for(var i=0;i<cars.length;i++)if(!cars[i].ai){s+=cars[i].dist;n++;}return n?s/n:0;}
function driveAI(c,dt,now,avg){
  S(c.dist,sA);var k=sA.k;S(c.dist+35,sB);
  var tx=clamp(-sB.k*260,-W*0.62,W*0.62)+c.lane,i,o,d,s=mod(c.dist);
  for(i=0;i<cars.length;i++){o=cars[i];if(o===c)continue;d=o.dist-c.dist;if(d>0&&d<16&&Math.abs(o.x-c.x)<2.9)tx+=(c.x>=o.x?1:-1)*3.6;}
  for(i=0;i<holes.length;i++){o=holes[i];if(o.dead)continue;d=wrapD(o.s-s);if(d>0&&d<34&&Math.abs(o.x-c.x)<WALL_W/2+1.6&&(c.i*7+Math.floor(o.s))%5!==0)tx+=(c.x>=o.x?1:-1)*6;}
  tx=clamp(tx,-W+1.6,W-1.6);
  var stuck=c.stun>0&&c.stunK===3,lv=stuck?0:clamp(tx-c.x,-1,1)*9;c.x+=lv*dt;c.yaw=lerp(c.yaw,lv/9,1-Math.exp(-6*dt));
  var gap=c.dist-avg,band=c.ai?(gap>70?0.93:gap<-70?1.06:1):1;
  var tv=c.base*band*(1-Math.min(0.16,Math.abs(k)*4.5))*(1+0.03*Math.sin(now*0.7+c.ph));
  if(c.boost>0)tv=Math.max(tv,VBOOST*0.9);
  if(c.stun>0)tv=c.stunK===1?12:c.stunK===2?34:0;
  c.v+=(tv-c.v)*(tv<c.v?2.4:1.2)*dt;c.dist+=c.v*dt/clamp(1+c.x*k,0.7,1.5);
  tickStatus(c,dt,mod(c.dist));
  if(c.items.length&&c.stun<=0&&c.fin===null){c.useT-=dt;c.holdT+=dt;
    if(c.useT<=0){var ok=true,it=c.items[0];
      if(it===1){ok=false;for(i=0;i<cars.length;i++){o=cars[i];if(o!==c&&Math.hypot(wrapD(o.dist-c.dist),o.x-c.x)<FIRE_R-1)ok=true;}}
      else if(it===3){ok=false;for(i=0;i<cars.length;i++){o=cars[i];d=c.dist-o.dist;if(o!==c&&d>8&&d<70)ok=true;}}
      if(ok||c.holdT>9){if(useItem(c,0)){c.useT=1+Math.random()*2.5;c.holdT=0;}else{c.useT=0.6;if(c.holdT>12){c.items.shift();c.holdT=0;}}}else c.useT=0.4;}}
}
function drivePlayer(c,dt){
  S(c.dist,sA);var k=sA.k,st=steerInput();
  var stuck=c.stun>0&&c.stunK===3;
  steerVis=lerp(steerVis,stuck?0:st,1-Math.exp(-10*dt));c.yaw=steerVis;
  var off=Math.abs(c.x)>W+0.4,target=c.boost>0?VBOOST:VMAX;if(off)target=Math.min(target,30);
  if(c.stun>0)target=c.stunK===1?12:c.stunK===2?34:0;
  c.v+=(target-c.v)*(target>c.v?(c.boost>0?2.4:0.95):2.6)*dt;
  if(!stuck)c.x+=steerVis*STEER*(0.45+0.55*c.v/VMAX)*dt+k*c.v*c.v*CENT*dt;
  c.x=clamp(c.x,-(W+5),W+5);
  c.dist+=c.v*dt/clamp(1+c.x*k,0.7,1.5);
  tickStatus(c,dt,mod(c.dist));
  var lap=Math.floor(c.dist/L);
  if(lap>lastLap){lastLap=lap;if(lap<LAPS){flash(lap===LAPS-1?'最後一圈！':'第 '+(lap+1)+' 圈',true);sfx(523,0.12,'square',0.05);}}
}
function driveRemote(c,dt){
  c.nd+=c.v*dt;var e=1-Math.exp(-9*dt);c.dist=lerp(c.dist,c.nd,e);var px=c.x;c.x=lerp(c.x,c.nx,e);

function collide(){
  for(var i=0;i<cars.length;i++)for(var j=i+1;j<cars.length;j++){
    var a=cars[i],b=cars[j],d=b.dist-a.dist,dx=b.x-a.x;
    if(Math.abs(d)<4.6&&Math.abs(dx)<2.3){
      var push=(2.3-Math.abs(dx))*0.5*(dx<0?-1:1);if(a.own)a.x-=push;if(b.own)b.x+=push;
      var rear=d>0?a:b,front=d>0?b:a;if(rear.own&&rear.v>front.v)rear.v=Math.max(front.v*0.97,rear.v-40*0.016);
      if((a===me||b===me)&&state==='race'&&shake<0.15){shake=0.22;sfx(180,0.08,'square',0.05);}
    }}

  var used={},list=[],i,k=0;
  net.humans.forEach(function(h){used[h.c]=1;list.push({n:h.n,c:h.c,ai:false,conn:h.conn});});

  roster=list;
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pubRoster(){return roster.map(function(r){return{n:r.n,c:r.c,ai:r.ai};});}
function sendLobby(){
  buildRoster();
  roster.forEach(function(r,i){if(r.conn)send(r.conn,{t:'lobby',me:i,list:pubRoster(),code:net.code});});
  mySlot=0;renderLobby();
}
function netMsg(key){return{'peer-unavailable':'找不到這個房間，檢查一下房號','unavailable-id':'房號重複了，再按一次開房間','network':'連不上連線伺服器，檢查網路後再試','server-error':'連線伺服器忙線中，稍後再試','socket-error':'連線中斷了','socket-closed':'連線中斷了','browser-incompatible':'這個瀏覽器不支援連線對戰','webrtc':'兩邊的網路連不起來，換個網路試試'}[key]||'連線失敗（'+key+'）';}
function needPeer(){
  if(typeof window.Peer==='undefined'){$('homeMsg').textContent='這個頁面不能連線對戰，請改用 GitHub 的網址開啟；單人賽可以照玩。';return false;}return true;
}
function busy(on){['soloBtn','hostBtn','joinBtn'].forEach(function(id){$(id).disabled=on;});}
function hostRoom(){
  if(!needPeer())return;wake();var prof=myProfile();closeNet();busy(true);$('homeMsg').textContent='開房間中…';
  var code=String(1000+Math.floor(Math.random()*9000)),peer,opened=false;
  try{peer=new window.Peer(PREFIX+code);}catch(e){busy(false);$('homeMsg').textContent='這個頁面不能連線對戰，請改用 GitHub 的網址開啟。';return;}
  net.peer=peer;net.mode='host';net.code=code;
  var to=setTimeout(function(){if(!opened){closeNet();busy(false);$('homeMsg').textContent='開房間逾時，檢查網路後再試';}},15000);
  peer.on('open',function(){
    opened=true;clearTimeout(to);busy(false);$('homeMsg').textContent='';
    net.humans=[{n:prof.n,c:prof.c,conn:null}];
    net.aiPool=shuffle([0,1,2,3,4,5,6,7]);
    state='lobby';sendLobby();show('lobby');
  });
  peer.on('connection',function(conn){
    net.conns.push(conn);
    conn.on('data',function(m){hostData(conn,m);});
    conn.on('close',function(){hostLost(conn);});
    conn.on('error',function(){hostLost(conn);});
  });
  peer.on('error',function(err){
    if(!opened){clearTimeout(to);closeNet();busy(false);$('homeMsg').textContent=netMsg(err&&err.type);}
  });
}
function slotOf(conn){for(var i=0;i<roster.length;i++)if(roster[i].conn===conn)return i;return -1;}
function hostLost(conn){
  var i=net.conns.indexOf(conn);if(i<0)return;net.conns.splice(i,1);
  net.humans=net.humans.filter(function(h){return h.conn!==conn;});
  if(state==='lobby')sendLobby();
  else{var s=slotOf(conn);if(s>=0){roster[s].conn=null;roster[s].ai=true;if(cars[s]){cars[s].ai=true;cars[s].own=true;cars[s].stun=0;}}}
}
function hostData(conn,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='join'){
    if(state!=='lobby'){send(conn,{t:'no',why:'比賽進行中，等這場跑完再加入'});return;}
    if(net.humans.length>=NCAR){send(conn,{t:'no',why:'房間滿了'});return;}
    net.humans.push({n:String(m.n||'玩家').slice(0,6),c:clamp(m.c|0,0,7),conn:conn});sendLobby();return;
  }
  var s=slotOf(conn);if(s<0)return;
  if(m.t==='s'){var c=cars[s];if(c&&!c.own){c.nd=+m.d||0;c.nx=+m.x||0;c.v=+m.v||0;c.flags=m.f|0;}}
  else if(m.t==='ev'&&m.e){if(m.e.from===s||m.e.k==='holeX'){applyEvent(m.e);broadcast({t:'ev',e:m.e},conn);}}
  else if(m.t==='fin'){recordFin(s,+m.time||0);}
}
function joinRoom(){
  if(!needPeer())return;wake();var code=($('codeIn').value||'').replace(/\D/g,'');
  if(code.length!==4){$('homeMsg').textContent='房號是 4 個數字';return;}
  var prof=myProfile();closeNet();busy(true);$('homeMsg').textContent='加入中…';
  var peer,joined=false;
  try{peer=new window.Peer();}catch(e){busy(false);$('homeMsg').textContent='這個頁面不能連線對戰，請改用 GitHub 的網址開啟。';return;}
  net.peer=peer;net.mode='client';net.code=code;
  function bail(msg){clearTimeout(to);closeNet();busy(false);clearCars();setPreview(previewIdx);state='home';show('home');$('homeMsg').textContent=msg;}
  var to=setTimeout(function(){if(!joined)bail('加入逾時，確認房號和網路後再試');},15000);
  peer.on('open',function(){
    var conn=peer.connect(PREFIX+code,{reliable:true});net.host=conn;
    conn.on('open',function(){send(conn,{t:'join',n:prof.n,c:prof.c});});
    conn.on('data',function(m){
      if(!m||typeof m!=='object')return;
      if(m.t==='no'){bail(m.why||'加不進去');return;}
      if(!joined){joined=true;clearTimeout(to);busy(false);$('homeMsg').textContent='';}
      clientData(m);
    });
    conn.on('close',function(){if(net.mode==='client')bail('房主離線了，房間已關閉');});
  });
  peer.on('error',function(err){if(!joined)bail(netMsg(err&&err.type));});
}
function clientData(m){
  if(m.t==='lobby'){roster=m.list;mySlot=m.me;net.code=m.code||net.code;clearCars();clearFx();setPreview(roster[mySlot].c);state='lobby';renderLobby();show('lobby');}
  else if(m.t==='start'){roster=m.list;mySlot=m.me;startRace(m.g);}
  else if(m.t==='S'){for(var i=0;i<m.a.length;i++){var a=m.a[i],c=cars[a[0]];if(c&&!c.own){c.nd=a[1];c.nx=a[2];c.v=a[3];c.flags=a[4];}}}
  else if(m.t==='ev'){if(cars.length)applyEvent(m.e);}
  else if(m.t==='res'){results=m.r;m.r.forEach(function(r){if(cars[r.i]&&cars[r.i].fin===null)cars[r.i].fin=r.time;});if(state==='done')renderResult();}
}
function netTick(dt){
  if(net.mode==='solo'||!cars.length)return;
  net.timer+=dt;if(net.timer<0.075)return;net.timer=0;
  var r1=function(v){return Math.round(v*100)/100;};
  if(net.mode==='client'){send(net.host,{t:'s',d:r1(me.dist),x:r1(me.x),v:r1(me.v),f:carFlags(me)});}
  else{var a=cars.map(function(c){return[c.i,r1(c.own?c.dist:c.nd),r1(c.own?c.x:c.nx),r1(c.v),c.own?carFlags(c):c.flags];});broadcast({t:'S',a:a});}
}
function recordFin(i,time){
  for(var k=0;k<results.length;k++)if(results[k].i===i)return;
  results.push({i:i,time:time});results.sort(function(a,b){return a.time-b.time;});
  if(cars[i]&&cars[i].fin===null)cars[i].fin=time;
  if(net.mode==='host')broadcast({t:'res',r:results});
  if(state==='done')renderResult();
}

/* ================= screens ================= */
function rowHtml(rank,r,extra,mine){return '<li'+(mine?' class="me"':'')+'><b>'+rank+'</b><img alt="" src="'+ASSETS[CHARS[r.c].id].img+'"><span>'+esc(r.n)+'</span><em>'+extra+'</em></li>';}
function renderLobby(){
  $('roomCode').textContent=net.code;
  $('roster').innerHTML=roster.map(function(r,i){return rowHtml(i+1,r,r.ai?'電腦':(i===0?'房主':'玩家')+(i===mySlot?'（你）':''),i===mySlot);}).join('');
  var host=net.mode==='host';$('startBtn').hidden=!host;$('lobbyMsg').textContent=host?'':'等房主按開始…';$('lobbyMsg').style.color='var(--mute)';
}
function renderResult(){
  var done={},rows=[],i;
  results.forEach(function(r,n){done[r.i]=1;rows.push(rowHtml(n+1,roster[r.i],fmt(r.time),r.i===mySlot));});
  var rest=cars.filter(function(c){return !done[c.i];}).sort(function(a,b){return b.dist-a.dist;});
  rest.forEach(function(c,n){rows.push(rowHtml(results.length+n+1,roster[c.i],'還在跑',c.i===mySlot));});
  $('standings').innerHTML=rows.join('');
  var place=1;for(i=0;i<results.length;i++)if(results[i].i===mySlot)place=i+1;
  $('place').innerHTML=['讚啦！','差一點！','不錯喔','還可以','再加油','下次雪恥'][place-1]+' 第 <b>'+place+'</b> 名';
  var solo=net.mode==='solo',host=net.mode==='host';
  $('againBtn').hidden=!(solo||host);$('againBtn').textContent=solo?'再跑一次':'回到房間';
  $('backBtn').textContent=solo?'換角色':'離開房間';
  $('resultMsg').textContent=net.mode==='client'?'等房主開下一場…':'';$('resultMsg').style.color='var(--mute)';
}
function startRace(grid){
  wake();makeCars(grid);clearFx();results=[];raceT=0;steerVis=0;lastLap=0;camX=me.x*0.8;
  boxes.forEach(function(b){b.cd=0;b.sp.visible=true;});
  showItem();show('hud');state='count';countT=3.4;shown={};
}
function hostStart(){
  buildRoster();mySlot=0;var grid=shuffle([0,1,2,3,4,5]);
  roster.forEach(function(r,i){if(r.conn)send(r.conn,{t:'start',me:i,list:pubRoster(),g:grid});});
  startRace(grid);
}
function soloStart(){
  wake();var prof=myProfile();closeNet();net.mode='solo';
  net.humans=[{n:prof.n,c:prof.c,conn:null}];net.aiPool=shuffle([0,1,2,3,4,5,6,7]);buildRoster();mySlot=0;
  var grid=shuffle([0,1,2,3,4]);grid.unshift(5);startRace(grid);
}
function goHome(msg){closeNet();clearCars();clearFx();setPreview(previewIdx);state='home';show('home');busy(false);$('homeMsg').textContent=msg||'';}
function finish(){
  state='done';streaks.className='';show('result');
  recordFin(mySlot,raceT);if(net.mode==='client')send(net.host,{t:'fin',time:raceT});
  renderResult();
  var p=rankOf(me);sfx(p===1?523:330,0.18,'square',0.06);setTimeout(function(){sfx(p===1?784:262,0.35,'square',0.06);},180);
}
$('soloBtn').addEventListener('click',soloStart);
$('hostBtn').addEventListener('click',hostRoom);
$('joinBtn').addEventListener('click',joinRoom);
$('startBtn').addEventListener('click',function(){if(net.mode==='host')hostStart();});
$('leaveBtn').addEventListener('click',function(){goHome('');});
$('backBtn').addEventListener('click',function(){goHome('');});
$('againBtn').addEventListener('click',function(){
  if(net.mode==='solo')soloStart();
  else if(net.mode==='host'){clearCars();clearFx();setPreview(previewIdx);state='lobby';sendLobby();show('lobby');}
});
(function(){
  var saved=0,nm='';try{saved=charIdx(localStorage.getItem('zan-char')||'zan');nm=localStorage.getItem('zan-name')||'';}catch(e){}
  $('nameIn').value=nm;
  var pk=$('picker');
  CHARS.forEach(function(ch,i){
    var b=document.createElement('button');b.type='button';b.setAttribute('role','radio');b.setAttribute('aria-label',ch.name);b.setAttribute('aria-checked',i===saved?'true':'false');
    var im=document.createElement('img');im.alt='';im.src=ASSETS[ch.id].img;b.appendChild(im);
    b.addEventListener('click',function(){for(var k=0;k<pk.children.length;k++)pk.children[k].setAttribute('aria-checked',k===i?'true':'false');setPreview(i);wake();sfx(660,0.08,'square',0.04);});
    pk.appendChild(b);
  });
  setPreview(saved);
})();

/* ================= main loop ================= */
var last=0;
function frame(ms){
  requestAnimationFrame(frame);
  var now=ms/1000,dt=Math.min(0.05,now-last||0.016);last=now;nowT=now;
  var i,c;
  if(state==='count'){
    countT-=dt;var n=Math.ceil(countT);
    if(n!==shown.c&&n>=1&&n<=3){shown.c=n;flash(String(n));sfx(440,0.12,'square',0.05);}
    if(countT<=0){state='race';flash('衝！');sfx(880,0.35,'square',0.06);}
  }
  if(state==='race'||state==='done'){
    raceT+=dt;var avg=humanAvg();
    for(i=0;i<cars.length;i++){c=cars[i];
      if(c===me&&state==='race')drivePlayer(c,dt);else if(c.own)driveAI(c,dt,now,avg);else driveRemote(c,dt);}
    collide();
    for(i=0;i<cars.length;i++){c=cars[i];if(c.own){c.x=clamp(c.x,-(W+5),W+5);
      if(c.fin===null&&c.dist>=LAPS*L){if(c===me){if(state==='race')finish();}else{recordFin(c.i,raceT);}}}}
    for(i=0;i<holes.length;i++){var hw=holes[i];hw.t+=dt;if(hw.t>WALL_LIFE){scene.remove(hw.mesh);holes.splice(i,1);i--;}else hw.mesh.scale.y=Math.max(0.03,Math.min(1,hw.t/0.25,(WALL_LIFE-hw.t)/0.35));}
    netTick(dt);
  }
  for(i=0;i<cars.length;i++)placeCar(cars[i],now,dt);
  for(i=fx.length-1;i>=0;i--){var o=fx[i];o.t+=dt;if(o.t>=o.life){scene.remove(o.sp);fx.splice(i,1);}else o.up(o.sp,o.t/o.life);}
  var sv=me?me.v:26,spin=sv*dt/0.4;for(i=0;i<spinTex.length;i++)spinTex[i].rotation+=(i%2?-1:1)*spin;
  for(i=0;i<boxes.length;i++){var b=boxes[i];if(b.cd>0){b.cd-=dt;if(b.cd<=0)b.sp.visible=true;}b.sp.position.y=1.8+Math.sin(now*3+b.ph)*0.25;}

  /* camera */
  var ease;
  if(state==='race'||state==='count'){
    S(me.dist-camBack,sB);camX=lerp(camX,me.x*0.8,1-Math.exp(-7*dt));
    camDes.set(sB.x+sB.rx*camX,camH,sB.z+sB.rz*camX);
    S(me.dist+16,sC);lookDes.set(sC.x+sC.rx*me.x*0.5,1.2,sC.z+sC.rz*me.x*0.5);
    ease=state==='count'?1-Math.exp(-3.2*dt):1-Math.exp(-22*dt);
  }else{
    orbit+=dt*(reduce?0.08:0.32);var tg=me?me.g:preview,pp=tg.position,rad=portrait?13:11;
    if(!me)tg.rotation.y+=0;
    camDes.set(pp.x+Math.cos(orbit)*rad,3.4,pp.z+Math.sin(orbit)*rad);lookDes.set(pp.x,portrait?-4.6:-2.6,pp.z);
    ease=camInit?1-Math.exp(-2.5*dt):1;
  }
  camInit=true;
  camera.position.lerp(camDes,ease);look.lerp(lookDes,ease);
  if(shake>0){shake-=dt;if(!reduce){camera.position.x+=(Math.random()-0.5)*shake*1.2;camera.position.y+=(Math.random()-0.5)*shake*0.8;}}
  camera.up.set(0,1,0);camera.lookAt(look);
  if(state==='race'&&!reduce)camera.rotateZ(-steerVis*0.045);
  var boosting=state==='race'&&me&&me.boost>0;
  var fovT=baseFov+(boosting&&!reduce?7:0);
  if(Math.abs(camera.fov-fovT)>0.05){camera.fov=lerp(camera.fov,fovT,1-Math.exp(-5*dt));camera.updateProjectionMatrix();}
  horizon.position.x=camera.position.x;horizon.position.z=camera.position.z;
  sunSp.position.set(camera.position.x-900,520,camera.position.z+1250);

  if(state==='race'||state==='count'){
    setText(elRank,'r',String(rankOf(me)));
    setText(elLap,'l',String(clamp(Math.floor(me.dist/L)+1,1,LAPS)));
    setText(elTime,'t',fmt(state==='race'?raceT:0));
    setText(elSpd,'s',String(Math.round(me.v*3.3)));
    var st=state==='race'?steerInput():0;
    if(shown.pl!==st){shown.pl=st;padL.className='pad'+(st<0?' on':'');padR.className='pad'+(st>0?' on':'');}
    if(shown.b!==boosting){shown.b=boosting;streaks.className=boosting?'on':'';}
  }
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();
</script>
